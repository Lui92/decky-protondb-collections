<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ProtonDB Collections - Demo Frontend</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 20px; }
      .row { display:flex; gap:8px; align-items:center; margin-bottom:8px }
      .badge { padding:4px 8px; border:1px solid #ccc; border-radius:4px }
    </style>
    <!-- Load React and Babel from CDN for quick demo -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <h1>ProtonDB Collections — Demo Frontend</h1>
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      // serverApi that calls the express bridge at /rpc
      const serverApi = {
        async callPluginMethod(name, args) {
          console.log('serverApi.callPluginMethod', name, args);
          const res = await fetch('/rpc', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ method: name, args })
          });
          return (await res.json()).result;
        }
      };

      function App(){
        const [settings, setSettings] = useState(null);
        const [progress, setProgress] = useState(null);
        const [running, setRunning] = useState(false);

        React.useEffect(()=>{
          (async()=>{
            const s = await serverApi.callPluginMethod('getSettings');
            setSettings(s);
          })();
        },[]);

        const saveSettings = async () => {
          await serverApi.callPluginMethod('updateSettings', settings);
          alert('Saved');
        };

        const generate = async () => {
          setRunning(true);
          setProgress(null);
          try {
            await serverApi.callPluginMethod('generateCollections', null);
            alert('Generation complete (demo)');
          } catch (e) {
            alert('Generation failed: ' + e);
          } finally {
            setRunning(false);
            setProgress(null);
          }
        };

        if (!settings) return <div>Loading settings...</div>;

        return (
          <div>
            <div className="row">
              <label>Enabled badges:</label>
              <div>
                {['platinum','gold','silver','bronze','borked'].map(b=> (
                  <label key={b} style={{marginRight:8}}>
                    <input type="checkbox" checked={settings.enabledBadges.includes(b)} onChange={(e)=>{
                      const next = e.target.checked ? [...settings.enabledBadges, b] : settings.enabledBadges.filter(x=>x!==b);
                      setSettings({...settings, enabledBadges: next});
                    }} /> {b}
                  </label>
                ))}
              </div>
            </div>

            <div className="row">
              <label>Installed only:</label>
              <input type="checkbox" checked={settings.installedOnly} onChange={(e)=>setSettings({...settings, installedOnly: e.target.checked})} />
            </div>

            <div className="row">
              <button onClick={saveSettings}>Save Settings</button>
              <button onClick={generate} disabled={running}>{running ? 'Running...' : 'Generate Collections'}</button>
            </div>

            {running && (
              <div className="row">
                <label>Progress:</label>
                <div style={{width:200, height:12, border:'1px solid #ccc'}}>
                  <div style={{width: (progress||0)+'%', height:12, background:'#4caf50'}} />
                </div>
                <div style={{marginLeft:8}}>{progress}%</div>
              </div>
            )}

          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
