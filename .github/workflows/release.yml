name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag name (e.g. v0.1.0-alpha.1). If empty, a tag will be generated.'
        required: false
      prerelease:
        description: 'Mark release as prerelease? true/false'
        required: false
        default: 'true'
  push:
    tags:
      - 'v*'

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Read plugin name from package.json
        id: plugin_name
        run: |
          echo "PLUGIN_NAME=$(node -p 'require(`./package.json`).name')" >> $GITHUB_ENV
      - name: Install deps
        run: npm ci --legacy-peer-deps
      - name: Build
        run: npm run build
      # No manual dist prep needed; handled by build/package scripts
      - name: Compute release name and tag
        run: |
          # Compose tag and asset name with plugin name prefix
          PLUGIN_NAME="${PLUGIN_NAME:-decky-protondb-collections}"
          if [ -n "${INPUT_RELEASE_TAG}" ]; then
            NAME="$PLUGIN_NAME-${INPUT_RELEASE_TAG}"
            TAG="$PLUGIN_NAME-${INPUT_RELEASE_TAG}"
          elif [ -n "${GITHUB_REF_NAME}" ]; then
            NAME="$PLUGIN_NAME-${GITHUB_REF_NAME}"
            TAG="$PLUGIN_NAME-${GITHUB_REF_NAME}"
          else
            NAME="$PLUGIN_NAME-release-${GITHUB_RUN_NUMBER}"
            TAG="$PLUGIN_NAME-v${GITHUB_RUN_NUMBER}"
          fi
          echo "RELEASE_NAME=$NAME" >> $GITHUB_ENV
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          # propagate prerelease input
          echo "PRERELEASE=${INPUT_PRERELEASE:-true}" >> $GITHUB_ENV
        env:
          PLUGIN_NAME: ${{ env.PLUGIN_NAME }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Create zip (npm run package)
        run: npm run package
      - name: Rename zip to match release name
        run: |
          PLUGIN_NAME="${PLUGIN_NAME:-decky-protondb-collections}"
          ZIP_NAME="$PLUGIN_NAME.zip"
          TARGET_NAME="${RELEASE_NAME}.zip"
          if [ "$ZIP_NAME" != "$TARGET_NAME" ]; then
            mv "$ZIP_NAME" "$TARGET_NAME"
          fi
        env:
          PLUGIN_NAME: ${{ env.PLUGIN_NAME }}
          RELEASE_NAME: ${{ env.RELEASE_NAME }}

      - name: Create or update GitHub Release
        id: create_release
        uses: actions/github-script@v6
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const prerelease = (process.env.PRERELEASE === 'true');
            try {
              const { data: existing } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              const { data } = await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: existing.id,
                tag_name: tag,
                name: tag,
                body: 'Automated release (updated)',
                draft: false,
                prerelease,
              });
              return data.id;
            } catch (err) {
              if (err.status === 404) {
                const { data } = await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tag,
                  name: tag,
                  body: 'Automated release (created)',
                  draft: false,
                  prerelease,
                });
                return data.id;
              }
              throw err;
            }
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          PRERELEASE: ${{ env.PRERELEASE }}

      - name: Upload release asset via API
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const releaseId = parseInt('${{ steps.create_release.outputs.result }}', 10);
            const assetPath = path.resolve(process.cwd(), `${process.env.RELEASE_NAME}.zip`);
            if (!fs.existsSync(assetPath)) {
              throw new Error(`Asset not found: ${assetPath}`);
            }
            const data = fs.readFileSync(assetPath);
            const name = `${process.env.RELEASE_NAME}.zip`;
            const contentType = 'application/zip';
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              name,
              data,
              headers: {
                'content-type': contentType,
                'content-length': data.length,
              },
            });
            return name;
        env:
          RELEASE_NAME: ${{ env.RELEASE_NAME }}
