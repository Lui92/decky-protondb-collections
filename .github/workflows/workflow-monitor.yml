name: Monitor Release Failures

on:
  workflow_run:
    workflows: [ "Release" ]
    types:
      - completed

jobs:
  handle-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report run info
        uses: actions/github-script@v7
        id: report
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = context.payload.workflow_run;
            const body = `Release workflow run [#${run.run_number}](${run.html_url}) failed.

Repository: ${context.repo.owner}/${context.repo.repo}
Run ID: ${run.id}
Conclusion: ${run.conclusion}
Head branch: ${run.head_branch}
Head SHA: ${run.head_sha}`;
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI: Release workflow failed (run #${run.run_number})`,
              body,
            });
            core.setOutput('issue_number', issue.data.number);

      - name: Attempt automatic retry
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runId = context.payload.workflow_run.id;
            try {
              await github.rest.actions.reRunWorkflow({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
              });
              core.info(`Triggered re-run of workflow run ${runId}`);
            } catch (err) {
              core.info(`Re-run request failed: ${err.message}`);
            }

      - name: Comment on issue with retry note
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = parseInt(core.getInput('issue_number') || '${{ steps.report.outputs.issue_number }}');
            const run = context.payload.workflow_run;
            const body = `This issue was created automatically after the Release workflow run [#${run.run_number}](${run.html_url}) failed. An automatic retry was attempted.

Please check the Actions page for logs and rerun manually if needed.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body,
            });

      - name: Analyze failing jobs and open auto-fix PRs
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = context.payload.workflow_run;
            const runId = run.id;
            // List jobs for the failed run
            const jobsResp = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const jobs = jobsResp.data.jobs || [];
            // Find the first failing step name
            let failingStepName = null;
            for (const job of jobs) {
              if (!job.steps) continue;
              for (const step of job.steps) {
                if (step.conclusion === 'failure') {
                  failingStepName = step.name || job.name || 'unknown';
                  break;
                }
              }
              if (failingStepName) break;
            }
            core.info(`Detected failing step: ${failingStepName}`);

            // Auto-fix: if Create zip failed, ensure release workflow installs zip
            if (failingStepName && failingStepName.toLowerCase().includes('zip')) {
              const path = '.github/workflows/release.yml';
              const { data: repoData } = await github.rest.repos.get({ owner: context.repo.owner, repo: context.repo.repo });
              const defaultBranch = repoData.default_branch;

              // Get file content
              const fileResp = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: defaultBranch,
              });
              const content = Buffer.from(fileResp.data.content, 'base64').toString('utf8');

              if (content.includes('apt-get install -y zip') || content.includes('apt-get install zip')) {
                core.info('release.yml already installs zip; skipping auto-fix.');
              } else {
                // Prepare branch
                const newBranch = `auto-fix/zip-install-${run.run_number}`;
                const refResp = await github.rest.git.getRef({ owner: context.repo.owner, repo: context.repo.repo, ref: `heads/${defaultBranch}` });
                const baseSha = refResp.data.object.sha;
                // Create branch
                try {
                  await github.rest.git.createRef({ owner: context.repo.owner, repo: context.repo.repo, ref: `refs/heads/${newBranch}`, sha: baseSha });
                } catch (e) {
                  core.info(`Branch ${newBranch} may already exist: ${e.message}`);
                }

                // Insert apt-get install line before cd dist in the Create zip step
                const needle = 'cd dist\n          zip -r ../${{ env.RELEASE_NAME }}.zip .';
                let newContent;
                if (content.includes(needle)) {
                  newContent = content.replace(needle, 'sudo apt-get update && sudo apt-get install -y zip\n          cd dist\n          zip -r ../${{ env.RELEASE_NAME }}.zip .');
                } else {
                  // fallback: append apt-get install at top of the Create zip step run block
                  newContent = content.replace('      - name: Create zip', '      - name: Create zip\n        run: |\n          sudo apt-get update && sudo apt-get install -y zip\n');
                }

                // Create or update file on new branch
                const updatedContent = Buffer.from(newContent, 'utf8').toString('base64');
                await github.rest.repos.createOrUpdateFileContents({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path,
                  message: `Auto-fix: install zip for release workflow (run ${run.run_number})`,
                  content: updatedContent,
                  branch: newBranch,
                  sha: fileResp.data.sha,
                });

                // Create PR
                const pr = await github.rest.pulls.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  head: newBranch,
                  base: defaultBranch,
                  title: `Auto-fix: ensure zip is installed in release workflow (run ${run.run_number})`,
                  body: `This PR was created automatically after the Release workflow run #${run.run_number} failed in step \`${failingStepName}\`.

It adds installation of the \`zip\` utility on the runner so the workflow can create the release artifact.`,
                });

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: parseInt('${{ steps.report.outputs.issue_number }}'),
                  body: `An automatic PR has been opened to address the suspected issue: ${pr.data.html_url}`,
                });
              }
            } else {
              core.info('No known auto-fix rule matched the failing step.');
            }
